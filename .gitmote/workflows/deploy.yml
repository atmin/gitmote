name: self-deploy

# Break-glass self-deploy: gitmote builds and deploys itself through its own
# local runner. Use it when the GitHub deployer is unavailable or an out-of-band
# deploy is wanted. GitHub Actions stays the everyday deployer on `master`
# (.github/workflows/ci.yml). This workflow runs only when the `self-deploy`
# branch is pushed to a *local* gitmote instance. Only a local instance can
# build. The Scaleway Serverless Job can't (docs/architecture/ci.md). That
# instance needs:
#   - GITMOTE_CI_ALLOW_BUILDS=1
#   - a running Docker daemon
#   - the CI secrets below
#
# This workflow is nearly identical to the `deploy` job in ci.yml. It has three
# deliberate differences:
#   1. It is gated on `self-deploy`, not `master`, so it never overlaps the
#      GitHub path.
#   2. GHCR auth uses a PAT (GHCR_USER and GHCR_TOKEN). Off GitHub, there is no
#      built-in GITHUB_TOKEN.
#   3. It builds linux/amd64 only. Scaleway needs amd64. GitHub also pushes an
#      arm64 tag, but only for local dev, and a deploy does not need it.

on:
  push:
    branches: [self-deploy]
  workflow_dispatch:

jobs:
  deploy:
    # A second gate. Even if the engine runs this file on another branch,
    # github.ref keeps the deploy confined to `self-deploy`. The runner resolves
    # github.ref from its `checkout -B <branch>`. This mirrors the job-level `if`
    # in ci.yml.
    if: github.ref == 'refs/heads/self-deploy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # an amd64 build on an arm64 dev host runs under emulation
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USER }}
          password: ${{ secrets.GHCR_TOKEN }}

      # Tag with the commit SHA, which the next steps deploy, and with a moving
      # `self-deploy` tag. Deliberately do NOT tag `:master`. That tag belongs to
      # the GitHub deployer, and a break-glass build must never overwrite it.
      - name: Build & push public image (amd64 for Scaleway)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/atmin/gitmote:self-deploy
            ghcr.io/atmin/gitmote:${{ github.sha }}

      - name: Install Scaleway CLI
        run: |
          SCW_URL=$(curl -s https://api.github.com/repos/scaleway/scaleway-cli/releases/latest \
            | grep -o '"browser_download_url": *"[^"]*linux_amd64"' | cut -d'"' -f4)
          sudo curl -fsSL "$SCW_URL" -o /usr/local/bin/scw
          sudo chmod +x /usr/local/bin/scw

      # This step is identical to the deploy in ci.yml. Point the container at the
      # unique image tagged with the SHA, and re-assert the scale pins. The writer
      # lease makes the rolling swap safe by construction. The new instance boots
      # as a follower, and the old one releases the lease on SIGTERM.
      #
      # WARNING: pass NO secret-environment-variables. `update` REPLACES the whole
      # map, so any value set here would wipe the AWS and litestream keys of prod
      # (docs/deploy-scaleway.md). An update with no env preserves the map.
      - name: Deploy (single writer)
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_ORGANIZATION_ID }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_PROJECT_ID }}
          SCW_DEFAULT_REGION: fr-par
        run: |
          scw container container update ${{ secrets.SCW_CONTAINER_ID }} \
            image=ghcr.io/atmin/gitmote:${{ github.sha }} \
            min-scale=0 max-scale=1 --wait
