# Self-deploy stack: MinIO only, reachable from a `bin/gitmote` that runs
# natively. `make self-deploy` drives it (scripts/self-deploy.sh). It is a
# sibling of compose/dev.yml, with its own:
#   - project name
#   - ports (9300 and 9301, not 9100 and 9101)
#   - volume
# So a break-glass self-deploy can run without touching or colliding with a
# live `make dev`.
name: gitmote-selfdeploy

services:
  minio:
    # Silo is the community fork of the MinIO server by Pigsty. It is pinned by
    # release tag and by digest. MinIO does not publish minio/minio or minio/mc.
    # Silo keeps the protocol, the MINIO_* variables and S3 conditional writes,
    # which the writer lease needs. The same image answers to `mc` for the setup
    # service.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address :9301
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9300:9000"   # S3 API: GITMOTE_S3_ENDPOINT=http://localhost:9300
      - "9301:9301"   # console: http://localhost:9301 (minioadmin/minioadmin)
    volumes:
      - minio-data:/data

  # One-shot bucket creation. Invoke it with `docker compose run --rm mc` (see dev).
  mc:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    profiles: ["setup"]
    depends_on: [minio]
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "until mc ls local >/dev/null 2>&1; do echo 'waiting for minio'; sleep 1; done; mc mb --ignore-existing local/gitmote"

volumes:
  minio-data:
