# Local self-hosting stack: MinIO as the object store, and gitmote as the single
# writer. `make e2e-local` drives it (scripts/e2e-local.sh). A bucket alone
# derives the metadata replica and the single-writer lease. So refs survive a
# restart through the gitmote-data volume. They also survive a full wipe,
# because gitmote restores them from S3 (see e2e-restore).
name: gitmote-e2e

services:
  minio:
    # Silo is the community fork of the MinIO server by Pigsty. It is pinned by
    # release tag and by digest. MinIO does not publish minio/minio or minio/mc.
    # Silo keeps the protocol, the MINIO_* variables and S3 conditional writes,
    # which the writer lease needs. The same image answers to `mc` for the setup
    # service.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    # No host port. Only the compose network (gitmote, mc) reaches MinIO. So
    # MinIO does not collide with anything already bound to :9000 on the host.
    volumes:
      - minio-data:/data

  # One-shot bucket creation. `up` does not start it (setup profile). Invoke it
  # with `docker compose run --rm mc`. MC_HOST_local configures the alias through
  # the env, so no interactive `mc alias set` is needed. The command retries until
  # MinIO is reachable.
  mc:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    profiles: ["setup"]
    depends_on: [minio]
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "until mc ls local >/dev/null 2>&1; do echo 'waiting for minio'; sleep 1; done; mc mb --ignore-existing local/gitmote"

  gitmote:
    build:
      context: .
    image: gitmote:e2e
    depends_on: [minio]
    environment: &gitmote-env
      GITMOTE_S3_BUCKET: gitmote        # the storage root, which derives the replica (s3://gitmote/meta)
      GITMOTE_S3_ENDPOINT: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "8080:8080"
    volumes:
      - gitmote-data:/data

  # A second instance on the same storage root, only for `make e2e-handoff`. It
  # is in the handoff profile, so a plain `up` leaves it alone. The two instances
  # take turns as the writer. An idle writer yields the lease, and the next
  # request on either instance takes it (docs/configuration.md).
  gitmote-b:
    image: gitmote:e2e
    profiles: ["handoff"]
    depends_on: [minio]
    environment: *gitmote-env
    ports:
      - "8081:8080"
    volumes:
      - gitmote-b-data:/data

volumes:
  minio-data:
  gitmote-data:
  gitmote-b-data:
