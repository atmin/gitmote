# Local dev stack: MinIO only, reachable from a `bin/gitmote` that runs natively.
# `make dev` drives it (scripts/dev.sh). In compose/e2e.yml, the e2e topology,
# gitmote also runs in a container. Here gitmote runs on the host, so MinIO must
# publish its ports. The ports are 9100 and 9101, not the usual 9000 and 9001.
# So they do not collide with any other local MinIO.
name: gitmote-dev

services:
  minio:
    # Silo is the community fork of the MinIO server by Pigsty. It is pinned by
    # release tag and by digest. MinIO does not publish minio/minio or minio/mc.
    # Silo keeps the protocol, the MINIO_* variables and S3 conditional writes,
    # which the writer lease needs. The same image answers to `mc` for the setup
    # service.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    command: server /data --console-address :9101
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9100:9000"   # S3 API: GITMOTE_S3_ENDPOINT=http://localhost:9100
      - "9101:9101"   # console: http://localhost:9101 (minioadmin/minioadmin)
    volumes:
      - minio-data:/data

  # One-shot bucket creation. `up` does not start it (setup profile). Invoke it
  # with `docker compose run --rm mc`. MC_HOST_local configures the alias through
  # the env, so no interactive `mc alias set` is needed. The command retries until
  # MinIO is reachable.
  mc:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z@sha256:635197cb9f36d01bee221d34d1c7d7960f6a95c48b0b6c01d99cd13bdae51a46
    profiles: ["setup"]
    depends_on: [minio]
    environment:
      MC_HOST_local: http://minioadmin:minioadmin@minio:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "until mc ls local >/dev/null 2>&1; do echo 'waiting for minio'; sleep 1; done; mc mb --ignore-existing local/gitmote"

volumes:
  minio-data:
