name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make all

  # The end-to-end suites:
  #   - push and clone of the real repo against a gitmote container backed by
  #     MinIO (scripts/e2e-local.sh)
  #   - the litestream cold-start restore (scripts/e2e-restore.sh)
  #   - two instances that take turns as the writer (scripts/e2e-handoff.sh)
  #   - the CI image-build gate (scripts/e2e-build.sh)
  # The job builds an image and runs Docker. So it stays off the fast path for
  # each PR, and it runs on master or on demand.
  e2e:
    if: github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the push needs the full history, not a shallow clone
      - run: make e2e-local
      - run: make e2e-restore
      - run: make e2e-handoff
      - run: make e2e-build

  # Publish the server image to GHCR on every green push to master. CI deploys
  # nothing. An operator pulls the image (docs/deploy-scaleway.md#deploy).
  publish:
    if: github.ref == 'refs/heads/master'
    needs: [ci, e2e]
    runs-on: ubuntu-latest
    # packages: write publishes the public image to GHCR through the built-in
    # GITHUB_TOKEN. Anyone then pulls it anonymously.
    # New GHCR packages are private by default. Make gitmote public once by hand.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3   # the arm64 runtime stage runs apk under emulation
      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push public image (amd64 and arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.sha }}
          tags: |
            ghcr.io/atmin/gitmote:master
            ghcr.io/atmin/gitmote:${{ github.sha }}
